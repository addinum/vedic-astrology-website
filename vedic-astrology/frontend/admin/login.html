<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Pandit Ji Vedic Astrology</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background: linear-gradient(135deg, var(--maroon), var(--maroon-dark)); }
  .login-card { background: var(--white); border-radius:18px; padding:44px; max-width:420px; width:92%; box-shadow: var(--shadow-soft); }
  .login-card .brand-mark { margin: 0 auto 18px; }
  .login-card h1 { text-align:center; font-size:24px; margin-bottom:6px; }
  .login-card p.sub { text-align:center; color:var(--text-muted); font-size:14px; margin-bottom:26px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand-mark" style="width:56px;height:56px;font-size:26px;">🕉</div>
    <h1>Admin Dashboard</h1>
    <p class="sub">Sign in to manage your website content</p>
    <div class="form-msg" id="loginMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Enter your password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('adminToken')) window.location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgEl = document.getElementById('loginMsg');
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = 'Signing in...';
      try {
        const formData = Object.fromEntries(new FormData(e.target).entries());
        const { token, admin } = await api.post('/auth/login', formData);
        localStorage.setItem('adminToken', token);
        localStorage.setItem('adminName', admin.name);
        window.location.href = 'dashboard.html';
      } catch (err) {
        msgEl.textContent = err.message || 'Login failed';
        msgEl.className = 'form-msg error';
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
